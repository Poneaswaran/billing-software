name: Build & Release Windows Installer

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release (e.g. 1.0.2)'
        required: false
        default: ''
  push:
    tags:
      - 'v*'

jobs:
  build:
    name: Build & Release ToyPop Billing Installer
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Install Inno Setup
        run: |
          choco install innosetup -y

      - name: Run Build Pipeline
        id: build_step
        shell: pwsh
        run: |
          if ("${{ github.event.inputs.version }}" -ne "") {
            python build_installer.py --version "${{ github.event.inputs.version }}" --no-release
          } else {
            python build_installer.py --no-bump --no-release
          }
          $exe = Get-ChildItem -Path dist\installer\*.exe | Select-Object -First 1
          Write-Host "Built Installer: $($exe.FullName)"
          Write-Output "installer_path=$($exe.FullName)" >> $env:GITHUB_OUTPUT
          Write-Output "installer_name=$($exe.Name)" >> $env:GITHUB_OUTPUT

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
        with:
          files: dist/installer/*.exe
          generate_release_notes: true
          draft: false
          prerelease: false
